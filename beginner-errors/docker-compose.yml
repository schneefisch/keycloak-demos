name: keycloak-beginner-errors

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      # Demo only: bootstrap admin for the master realm
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Error 6: one fixed issuer for browser and containers (hostname v2),
      # while back-channel URLs (jwks_uri, token_endpoint, ...) follow the request URL
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The Keycloak image has no curl: talk HTTP to the management port via bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    build: ./api
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Any HTTP answer (401 without a token) means the API is up
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8081/api/hello"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  spa:
    build: ./spa
    ports:
      - "5173:5173"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Helper container for scripts/code-exchange.sh, call-api.sh and decode-token.sh (curl, jq, openssl).
  # It shares Keycloak's network namespace, so http://localhost:8080 means the same Keycloak
  # as in your browser. Started on demand by the scripts only.
  toolbox:
    build: ./toolbox
    profiles: ["tools"]
    network_mode: "service:keycloak"
    volumes:
      - ./scripts:/scripts:ro
