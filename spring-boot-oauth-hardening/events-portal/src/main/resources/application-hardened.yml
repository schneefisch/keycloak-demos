# `user-name-attribute` stays at its default `sub`: stable and unique per issuer.

server:
  servlet:
    session:
      cookie:
        http-only: true
        # Lax, not Strict: the browser must send the session cookie on the redirect back from
        # Keycloak, or Spring can't find the stored authorization request (state, nonce, PKCE verifier).
        same-site: lax
        # In production (HTTPS): secure: true
