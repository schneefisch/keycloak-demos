name: spring-boot-oauth-hardening

# Each app runs in "naive" or "hardened" mode. scripts/mode.sh writes the modes to .env.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Demo only: bootstrap admin for the master realm
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # One issuer for browser and containers: http://localhost:8080/realms/demo.
      # Back-channel URLs (jwks_uri, token_endpoint, ...) follow the request URL, e.g. http://keycloak:8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
      # events-portal runs in this container's network namespace, so its port is published here
      - "8082:8082"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The Keycloak image has no curl: talk HTTP to the management port via bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Resource server
  events-api:
    build: ./events-api
    environment:
      SPRING_PROFILES_ACTIVE: ${EVENTS_API_MODE:-naive}
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Any HTTP answer (401 without a token) means the API is up
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8081/api/events"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Backend without frontend: resource server for its own API, and client of events-api
  # (client credentials grant)
  notification-service:
    build: ./notification-service
    environment:
      SPRING_PROFILES_ACTIVE: ${NOTIFICATION_SERVICE_MODE:-naive}
      NOTIFICATION_SERVICE_CLIENT_SECRET: notification-service-secret
    ports:
      - "8083:8083"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8083/api/notifications"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # BFF: authorization code grant as a confidential client, tokens stay on the server
  events-portal:
    build: ./events-portal
    # Shares Keycloak's network namespace: http://localhost:8080 is Keycloak for the app too, so the
    # issuer is the same for browser and app, and Keycloak reaches the back-channel logout endpoint
    # at http://localhost:8082. The portal still reaches events-api by its service name.
    network_mode: "service:keycloak"
    environment:
      SPRING_PROFILES_ACTIVE: ${EVENTS_PORTAL_MODE:-naive}
      EVENTS_PORTAL_CLIENT_SECRET: events-portal-secret
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8082/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Helper container for the scripts (curl, jq, openssl). It shares Keycloak's network namespace,
  # so http://localhost:8080 means the same Keycloak as in your browser. Started on demand only.
  toolbox:
    build: ./toolbox
    profiles: ["tools"]
    network_mode: "service:keycloak"
    volumes:
      - ./scripts:/scripts:ro
