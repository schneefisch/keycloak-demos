name: beginner-errors

on:
  push:
    paths:
      - 'beginner-errors/**'
      - '.github/workflows/beginner-errors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'beginner-errors/**'
      - '.github/workflows/beginner-errors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beginner-errors
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate realm-export.json
        run: python3 -c "import json; json.load(open('realm-export.json'))"

      - name: Validate compose files
        run: |
          docker compose config --quiet
          for f in compose/*.yml; do docker compose -f docker-compose.yml -f "$f" config --quiet; done

      - name: Check script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: beginner-errors
    env:
      AUTH_URL: http://localhost:8080/realms/demo/protocol/openid-connect/auth?client_id=spa&response_type=code&scope=openid&redirect_uri=http%3A%2F%2Flocalhost%3A5173%2F&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Baseline
        run: |
          curl -s "$AUTH_URL" | grep 'id="username"'
          docker compose exec -T api curl -s http://keycloak:8080/realms/demo/.well-known/openid-configuration \
            | jq -e '.issuer == "http://localhost:8080/realms/demo" and (.jwks_uri | startswith("http://keycloak:8080/"))'
          scripts/call-api.sh no-token | grep 'HTTP 401'
          curl -sf http://localhost:5173/ > /dev/null

      - name: Error 1 break/fix
        run: |
          scripts/break.sh 1 && scripts/break.sh 1
          curl -s "$AUTH_URL" | grep 'HTTPS required'
          scripts/fix.sh 1
          curl -s "$AUTH_URL" | grep 'id="username"'

      - name: Error 2 break/fix
        run: |
          scripts/break.sh 2 && scripts/break.sh 2
          curl -s "$AUTH_URL" | grep 'Invalid parameter: redirect_uri'
          scripts/fix.sh 2
          curl -s "$AUTH_URL" | grep 'id="username"'

      - name: Error 3 break/fix
        run: |
          scripts/break.sh 3a && scripts/break.sh 3b && scripts/fix.sh 3
          scripts/break.sh 3c && scripts/fix.sh 3

      - name: Error 5 break/fix
        run: |
          scripts/break.sh 5 && scripts/break.sh 5
          scripts/fix.sh 5 && scripts/fix.sh 5

      - name: Error 6 break/fix
        run: |
          scripts/break.sh 6
          docker compose exec -T api curl -s http://keycloak:8080/realms/demo/.well-known/openid-configuration \
            | jq -e '.issuer == "http://keycloak:8080/realms/demo"'
          scripts/fix.sh 6
          docker compose exec -T api curl -s http://keycloak:8080/realms/demo/.well-known/openid-configuration \
            | jq -e '.issuer == "http://localhost:8080/realms/demo"'

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose --profile tools down --rmi local
